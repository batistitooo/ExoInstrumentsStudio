<text x="372.0" y="446.0" font-size="12" fill="#16181d" text-anchor="middle" font-weight="400">required accuracy on the water column  (mm, log scale)</text>
<text x="92.0" y="472.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">red: the band needs the column known better than a low-cost GNSS delivers.  green: it does not.</text>
<text x="92.0" y="488.0" font-size="10.5" fill="#16181d" text-anchor="start" font-weight="600">The verdict is per band. It is not a property of the observatory.</text>
