<text x="652.0" y="424.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">10</text>
<line x1="652.0" y1="406.0" x2="652.0" y2="411.0" stroke="#6b7280" stroke-width="1"/>
