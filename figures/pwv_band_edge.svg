<text x="92.0" y="32.0" font-size="15" fill="#16181d" text-anchor="start" font-weight="600">The one term the instrument controls: where the red flank falls</text>
<text x="92.0" y="50.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">blue edge held at 750 nm, 2600 K target against 5800 K comparisons, airmass 1.2</text>
<text x="92.0" y="66.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Three telescopes, two of which carry measured QE curves. They agree, because the shape belongs to the 940 nm water band.</text>
