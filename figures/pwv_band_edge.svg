<text x="392.0" y="448.0" font-size="12" fill="#16181d" text-anchor="middle" font-weight="400">red edge of the blue arm  (nm)</text>
<text transform="translate(36,248.0) rotate(-90)" font-size="12" fill="#16181d" text-anchor="middle">differential water  (umag per mm of PWV)</text>
<text x="92.0" y="476.0" font-size="10.5" fill="#16181d" text-anchor="start" font-weight="600">A factor of 15 to 18 across 200 nm, and the split sits at about 88 % of the worst point.</text>
<text x="92.0" y="492.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">Moving the cut 35 nm bluer would cost a quarter as much water. Whether that trade is worth it is an instrument</text>
<text x="92.0" y="506.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">question - but it can now be made against a number instead of an intuition.</text>
